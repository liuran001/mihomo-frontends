rules:
  # 下联设备的 DNS 请求交给 dns 模块
  - DST-PORT,53,DNS_Hijack
  - DST-PORT,22,DIRECT
  # 支付宝香港直连
  - DOMAIN-SUFFIX,alipayhk.com,DIRECT
  - DOMAIN-SUFFIX,alipay.hk,DIRECT
  # 海外手机卡（eSIM / 漫游）的运营商服务走对应地区，否则激活、WiFi Calling 会失败
  # 英国：mcc234、Vodafone / VOXI、EE / CMLink UK、giffgaff
  - DOMAIN-KEYWORD,mcc234,英国
  - DOMAIN-SUFFIX,entsrv-uk.vodafone.com,英国
  - DOMAIN-SUFFIX,vuk-gto.prod.ondemandconnectivity.com,英国
  - DOMAIN,vfgb.idemia.io,英国
  - DOMAIN-SUFFIX,ct.ee.co.uk,英国
  - IP-CIDR,88.82.0.0/19,英国,no-resolve
  - IP-CIDR,148.252.160.0/19,英国,no-resolve
  - IP-CIDR,46.68.0.0/17,英国,no-resolve
  - IP-CIDR,87.194.0.0/16,英国,no-resolve
  - IP-CIDR,31.94.0.0/16,英国,no-resolve
  # 德国：O2 DE、Vodafone DE
  - IP-CIDR,62.52.0.0/14,德国,no-resolve
  - IP-CIDR,213.20.0.0/16,德国,no-resolve
  - IP-CIDR,139.7.0.0/16,德国,no-resolve
  # 香港：mcc454、CSL / 和记 / SmarTone
  - DOMAIN-KEYWORD,mcc454,香港
  - DOMAIN,csl.prod.ondemandconnectivity.com,香港
  - DOMAIN,hhk.prod.ondemandconnectivity.com,香港
  - DOMAIN,snr.prod.ondemandconnectivity.com,香港
  - IP-CIDR,107.178.224.0/19,香港,no-resolve
  # 可选：屏蔽海外 UDP 443（QUIC），让 YouTube 等回落到 TCP，部分机场 UDP 质量差时有用
  # - AND,((NETWORK,UDP),(DST-PORT,443),(NOT,((RULE-SET,cn)))),REJECT
  # 广告拦截
  - RULE-SET,AWAvenue-Ads,广告拦截
  # 应用分流
  - RULE-SET,scholar,学术
  - RULE-SET,ai,境外AI
  # Apple、微软、游戏的国内 CDN 直连，其余走对应策略组
  - RULE-SET,apple-cn,国内
  - RULE-SET,apple,Apple
  - RULE-SET,ehentai,ehentai
  - RULE-SET,github,Github
  - RULE-SET,twitter,Twitter
  - RULE-SET,youtube,YouTube
  - RULE-SET,google,Google
  - RULE-SET,google-cn,Google
  - RULE-SET,telegram,Telegram
  - RULE-SET,netflix,NETFLIX
  - RULE-SET,disney,Disney+
  - RULE-SET,tiktok,TikTok
  - RULE-SET,bahamut,巴哈姆特
  - RULE-SET,spotify,Spotify
  - RULE-SET,pixiv,Pixiv
  - RULE-SET,paypal,PayPal
  - RULE-SET,steam-cn,DIRECT
  - RULE-SET,games-cn,国内
  - RULE-SET,steam,Steam
  - RULE-SET,games,游戏
  - RULE-SET,onedrive,OneDrive
  - RULE-SET,microsoft-cn,国内
  - RULE-SET,microsoft,微软服务
  - RULE-SET,not-cn,其他
  - RULE-SET,google-ip,Google
  - RULE-SET,netflix-ip,NETFLIX
  - RULE-SET,telegram-ip,Telegram
  - RULE-SET,twitter-ip,Twitter
  - RULE-SET,cn,国内
  - RULE-SET,CN-IP,国内
  # 局域网地址直连
  - IP-CIDR,10.0.0.0/8,DIRECT
  - IP-CIDR,172.16.0.0/12,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT
  - MATCH,其他

# eBPF 透明入站：本机（cgroup）+ 下联网桥（packet_rewrite）
listeners:
  - name: ebpf-in
    type: ebpf
    mode: hybrid
    network: [tcp, udp]
    udp-timeout: 300
    bypass-rule-set: [CN-IP] # 国内 IP 在内核直连，不进核心
    local:
      data-plane: cgroup
      dns-mode: hijack
      ipv6: true
      bypass-private-address: true
    shared:
      #@lan
      data-plane: packet_rewrite
      dns-mode: hijack
      ipv6: true
      bypass-private-address: true
