  netflix-ip: {<<: *ri, path: ./rule_provider/netflix-ip.mrs, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/netflix.mrs"}
  telegram-ip: {<<: *ri, path: ./rule_provider/telegram-ip.mrs, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/telegram.mrs"}
