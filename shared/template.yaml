# ============================================================
# mihomo 内置模板（适配 liuran001/mihomo：eBPF 入站 + Smart 策略组）
# 结构来自实际使用中的手机/PC 配置：多机场订阅 → 地区 Smart 组 → 分应用策略组 → mrs 规则集分流。
# 由 LuCI「向导」与 Magisk 模块向导渲染：以 #@ 开头的行会换成订阅、面板密钥、镜像地址与下联接口，其余原样写入。
# 渲染结果是普通的 mihomo 配置，之后可以在「订阅」「策略组」「配置文件」等页面继续修改。
#   - 透明代理：eBPF hybrid，本机流量走 cgroup，下联走 packet_rewrite；国内 IP 在内核直连
#   - DNS：redir-host，53 端口由 DNS_Hijack 出站接管，国内域名用国内上游，海外走「dns」组
#   - 分流规则集用 MetaCubeX meta-rules-dat 的 mrs（经 jsDelivr，国内可直连），按需加载，比整份 geosite.dat 省内存
#   - 面板与 Fake-IP 规则集走 GitHub 镜像（向导里的「镜像前缀」，为空时直连 GitHub）
#   - 不含任何订阅地址或密钥
# 参考文档：https://wiki.metacubex.one/config
# ============================================================

# 锚点：订阅（proxy-providers）公共设置
p: &p
  type: http
  interval: 3600 # 订阅更新间隔（秒）
  health-check:
    enable: true
    url: https://cp.cloudflare.com
    interval: 300 # 健康检查间隔（秒）
    timeout: 1000 # 超时（毫秒）
# 锚点：select 策略组的公共出站列表
pr: &pr
  type: select
  proxies: [节点选择, 香港, 台湾, 日本, 新加坡, 美国, 英国, 德国, 其它地区, 全部节点, 自动选择, DIRECT]
# 锚点：Smart 智能择优组（各地区组与「全部节点」共用下列订阅）
# 策略组的测速参数是组内同级字段，嵌套的 health-check 不会被读取
use: &use
  type: smart
  use:
    #@use
  prefer-udp: true
  prefer-ipv6: true
  url: https://cp.cloudflare.com
  interval: 300
  timeout: 1500
  lazy: true

# 锚点：规则集（rule-providers）公共设置
rd: &rd {type: http, behavior: domain, format: mrs, interval: 86400}
ri: &ri {type: http, behavior: ipcidr, format: mrs, interval: 86400}

# 订阅
proxy-providers:
  #@providers

mixed-port: 7890
mode: rule
ipv6: true
allow-lan: true
bind-address: '*'
# 测延迟时先建好连接再计时，不同协议的握手开销不计入，节点之间可以公平比较
unified-delay: true
tcp-concurrent: true
log-level: warning
# 路由器上下联流量没有本地进程可查，关掉以省 CPU
find-process-mode: off

# 外部控制（LuCI 与 zashboard 面板都通过它管理内核）
external-controller: 0.0.0.0:9090
#@secret
external-ui: ./dashboard
#@ui-url

# Smart 内核可选项（需要时取消注释）：
#   profile.smart-collector-size: 100   # 择优数据收集文件上限（MB）
#   lgbm-auto-update: true              # LightGBM 模型自动更新（需能访问外网）
#   lgbm-update-interval: 72
#   lgbm-url: "https://github.com/vernesong/mihomo/releases/download/LightGBM-Model/Model.bin"
profile:
  store-selected: true
  store-fake-ip: true

# Geo 数据库：模板的分流全部用 mrs 规则集，不加载这些文件；只在自己添加 GEOSITE/GEOIP 规则时才会下载
geo-auto-update: false
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"

# 流量嗅探
sniffer:
  enable: true
  override-destination: false
  # 设备自带 DoH 或写死 IP 时拿不到域名，嗅探后域名规则才能生效
  parse-pure-ip: true
  skip-domain:
    - Mijia Cloud
    - +.push.apple.com
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

# Tun（路由器上由 eBPF 接管，保持关闭）
tun:
  enable: false

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  enhanced-mode: redir-host
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fc00::/18
  fake-ip-filter:
    - "rule-set:Fake-IP-Filter"
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    rule-set:AWAvenue-Ads: rcode://success
    "rule-set:cn,private,apple-cn,microsoft-cn,steam-cn,games-cn":
      - 223.5.5.5
      - 119.29.29.29
  # 海外域名经「dns」策略组发出（默认跟随节点选择）
  nameserver:
    - https://8.8.8.8/dns-query#dns
    - https://1.1.1.1/dns-query#dns

proxies:
  # 接管 53 端口的 DNS 请求，交给上面的 dns 模块解析
  - {name: DNS_Hijack, type: dns}

proxy-groups:
  - name: 节点选择
    type: select
    proxies: [全部节点, 自动选择, 香港, 台湾, 日本, 新加坡, 美国, 英国, 德国, 其它地区, DIRECT]
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png
  # 海外域名解析所走的节点，一般跟随节点选择
  - {name: dns, <<: *pr, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Server.png"}
  - {name: 广告拦截, type: select, proxies: [REJECT, DIRECT, 节点选择], icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Advertising.png"}
  - {name: 学术, <<: *pr, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Scholar.png"}
  - {name: 境外AI, <<: *pr, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/AI.png"}
  - {name: Apple, <<: *pr, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Apple.png"}
  - {name: Google, <<: *pr, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Google.png"}
  - {name: Telegram, <<: *pr, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Telegram.png"}
  - {name: Twitter, <<: *pr, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Twitter.png"}
  - {name: Pixiv, <<: *pr, icon: "https://testingcf.jsdelivr.net/gh/lige47/QuanX-icon-rule@main/icon/04ProxySoft/pixiv.png"}
  - {name: ehentai, <<: *pr, icon: "https://testingcf.jsdelivr.net/gh/lige47/QuanX-icon-rule@main/icon/04ProxySoft/exhentai.png"}
  - {name: 巴哈姆特, <<: *pr, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Bahamut.png"}
  - {name: YouTube, <<: *pr, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube.png"}
  - {name: NETFLIX, <<: *pr, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Netflix.png"}
  - {name: Disney+, <<: *pr, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Disney+.png"}
  - {name: TikTok, <<: *pr, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/TikTok.png"}
  - {name: Spotify, <<: *pr, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Spotify.png"}
  - {name: Github, <<: *pr, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/GitHub.png"}
  - {name: Steam, <<: *pr, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Steam.png"}
  - {name: 游戏, <<: *pr, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Game.png"}
  # 支付类网站对出口地区敏感，单独成组以便固定地区
  - {name: PayPal, <<: *pr, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/PayPal.png"}
  - {name: OneDrive, <<: *pr, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/OneDrive.png"}
  - {name: 微软服务, <<: *pr, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Microsoft.png"}
  - name: 国内
    type: select
    proxies: [DIRECT, 节点选择, 香港, 台湾, 日本, 新加坡, 美国, 英国, 德国, 其它地区, 全部节点, 自动选择]
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/China.png
  # 所有规则都没匹配到的流量（漏网之鱼）
  - {name: 其他, <<: *pr, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/ForeignMedia.png"}
  # 以下是地区分组（Smart 智能择优）；exclude-filter 去掉订阅里的流量、到期等说明节点
  - {name: 香港, <<: *use, filter: "(?i)(香港|🇭🇰|(^|[^A-Za-z0-9])(Hong[ _-]?Kong|HKG|HK)([ _-]?[A-Z]?[0-9]{1,3})?([^A-Za-z0-9]|$))", exclude-filter: &info "(?i)(流量|剩余|到期|过期|重置|套餐|官网|网站|频道|订阅|更新|客户端|请收藏|Traffic|Expire|Reset|Remaining|Bandwidth|Quota|TG[ _-]?bot)", icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hong_Kong.png"}
  - {name: 台湾, <<: *use, filter: "(?i)(台湾|臺灣|台灣|台北|臺北|🇹🇼|(^|[^A-Za-z0-9])(Taiwan|Taipei|TWN|TPE|TW)([ _-]?[A-Z]?[0-9]{1,3})?([^A-Za-z0-9]|$))", exclude-filter: *info, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Taiwan.png"}
  - {name: 日本, <<: *use, filter: "(?i)(日本|东京|東京|大阪|🇯🇵|(^|[^A-Za-z0-9])(Japan|Tokyo|Osaka|JPN|NRT|HND|KIX|JP)([ _-]?[A-Z]?[0-9]{1,3})?([^A-Za-z0-9]|$))", exclude-filter: *info, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Japan.png"}
  - {name: 新加坡, <<: *use, filter: "(?i)(新加坡|狮城|🇸🇬|(^|[^A-Za-z0-9])(Singapore|SGP|SIN|SG)([ _-]?[A-Z]?[0-9]{1,3})?([^A-Za-z0-9]|$))", exclude-filter: *info, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Singapore.png"}
  - {name: 美国, <<: *use, filter: "(?i)(美国|美國|🇺🇸|🇺🇲|(^|[^A-Za-z0-9])(United[ _-]?States|America|USA|US)([ _-]?[A-Z]?[0-9]{1,3})?([^A-Za-z0-9]|$))", exclude-filter: *info, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/United_States.png"}
  - {name: 英国, <<: *use, filter: "(?i)(英国|英國|🇬🇧|(^|[^A-Za-z0-9])(United[ _-]?Kingdom|Great[ _-]?Britain|Britain|England|GBR|UK)([ _-]?[A-Z]?[0-9]{1,3})?([^A-Za-z0-9]|$))", exclude-filter: *info, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/United_Kingdom.png"}
  - {name: 德国, <<: *use, filter: "(?i)(德国|德國|🇩🇪|(^|[^A-Za-z0-9])(Germany|Deutschland|DEU|DE)([ _-]?[A-Z]?[0-9]{1,3})?([^A-Za-z0-9]|$))", exclude-filter: *info, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Germany.png"}
  - {name: 其它地区, <<: *use, filter: ".*", exclude-filter: "(?i)(流量|剩余|到期|过期|重置|套餐|官网|网站|频道|订阅|更新|客户端|请收藏|Traffic|Expire|Reset|Remaining|Bandwidth|Quota|TG[ _-]?bot|香港|🇭🇰|(^|[^A-Za-z0-9])(Hong[ _-]?Kong|HKG|HK)([ _-]?[A-Z]?[0-9]{1,3})?([^A-Za-z0-9]|$)|台湾|臺灣|台灣|台北|臺北|🇹🇼|(^|[^A-Za-z0-9])(Taiwan|Taipei|TWN|TPE|TW)([ _-]?[A-Z]?[0-9]{1,3})?([^A-Za-z0-9]|$)|日本|东京|東京|大阪|🇯🇵|(^|[^A-Za-z0-9])(Japan|Tokyo|Osaka|JPN|NRT|HND|KIX|JP)([ _-]?[A-Z]?[0-9]{1,3})?([^A-Za-z0-9]|$)|美国|美國|🇺🇸|🇺🇲|(^|[^A-Za-z0-9])(United[ _-]?States|America|USA|US)([ _-]?[A-Z]?[0-9]{1,3})?([^A-Za-z0-9]|$)|新加坡|狮城|🇸🇬|(^|[^A-Za-z0-9])(Singapore|SGP|SIN|SG)([ _-]?[A-Z]?[0-9]{1,3})?([^A-Za-z0-9]|$)|英国|英國|🇬🇧|(^|[^A-Za-z0-9])(United[ _-]?Kingdom|Great[ _-]?Britain|Britain|England|GBR|UK)([ _-]?[A-Z]?[0-9]{1,3})?([^A-Za-z0-9]|$)|德国|德國|🇩🇪|(^|[^A-Za-z0-9])(Germany|Deutschland|DEU|DE)([ _-]?[A-Z]?[0-9]{1,3})?([^A-Za-z0-9]|$)|🇨🇳)", icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/World_Map.png"}
  - {name: 全部节点, <<: *use, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png"}
  - {name: 自动选择, <<: *use, tolerance: 50, type: url-test, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png"}

rule-providers:
  Fake-IP-Filter:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: ./rule_provider/Fake-IP-Filter.mrs
    #@fake-ip-filter-url
  AWAvenue-Ads:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: ./rule_provider/AWAvenue-Ads.mrs
    # jsDelivr 国内可直连；首次启动时订阅还没拉下来，经代理下载会失败
    url: "https://testingcf.jsdelivr.net/gh/TG-Twilight/AWAvenue-Ads-Rule@main/Filters/AWAvenue-Ads-Rule-Clash.mrs"
  CN-IP:
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400
    path: ./rule_provider/cn-ip.mrs
    url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/cn.mrs"
  # 以下来自 MetaCubeX/meta-rules-dat（meta 分支），与 geosite/geoip 同名分类内容一致
