<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mihomo 屏幕控制</title>
  <link rel="stylesheet" href="screen.css">
  <script src="jmuxer.min.js" defer></script>
  <script src="screen.js" defer></script>
</head>
<body>
<main>
  <header><div><h1>屏幕控制</h1><p>内置 scrcpy · 仅通过已鉴权的 WebUI 中转</p></div><a href="/#enhanced">返回设备控制</a></header>
  <p id="public-warning" class="warning" hidden>当前允许公网访问。屏幕控制拥有设备操作权限，强烈建议仅在局域网或 Tailscale 使用。</p>
  <section class="actions" aria-label="屏幕服务">
    <button id="start" type="button">开始连接</button>
    <button id="stop" type="button" class="secondary" disabled>停止连接</button>
    <button id="fullscreen" type="button" class="secondary">全屏</button>
    <output id="status" role="status" aria-live="polite">尚未连接；不会在后台录屏</output>
  </section>
  <div class="workspace">
    <section id="display" class="display" aria-label="设备屏幕">
      <video id="video" autoplay muted playsinline tabindex="0" aria-label="远程设备屏幕，点击或拖动控制"></video>
      <canvas id="canvas" tabindex="0" aria-label="远程设备屏幕，点击或拖动控制" hidden></canvas>
      <p id="empty">点击「开始连接」启动屏幕服务</p>
    </section>
    <section class="controls" aria-label="设备操作">
      <h2>操作</h2>
      <div class="keys">
        <button data-key="4" class="secondary" disabled>返回</button>
        <button data-key="3" class="secondary" disabled>主页</button>
        <button data-key="187" class="secondary" disabled>最近任务</button>
        <button data-key="26" class="secondary" disabled>电源键</button>
        <button data-key="24" class="secondary" disabled>音量加</button>
        <button data-key="25" class="secondary" disabled>音量减</button>
      </div>
      <button id="rotate" type="button" class="secondary" disabled>旋转屏幕</button>
      <label for="paste">粘贴文字</label>
      <textarea id="paste" rows="3" maxlength="1024" placeholder="发送前请确认目标输入框已选中" disabled></textarea>
      <button id="send-text" type="button" class="secondary" disabled>粘贴到设备</button>
      <p class="hint">粘贴会替换设备剪贴板，不自动读取剪贴板。隐藏、关闭页面或退出鉴权后停止录屏；每次连接最长 15 分钟。</p>
      <p class="hint">默认 1280 / 24 fps / 2 Mbps，无音频，不修改亮屏与休眠设置。受 DRM 保护的内容可能黑屏。</p>
    </section>
  </div>
</main>
</body>
</html>
