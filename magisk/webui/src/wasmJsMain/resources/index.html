    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f7f7f7;
      font-family: MihomoLoading, -apple-system, BlinkMacSystemFont, "MiSans", "PingFang SC", "Segoe UI", Roboto, sans-serif;
    }
    #composeApp {
      position: absolute;
      top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
      right: var(--safe-area-inset-right, env(safe-area-inset-right, 0px));
      bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
      left: var(--safe-area-inset-left, env(safe-area-inset-left, 0px));
      /* 手势全部交给 Compose：否则 WebView 接管纵向平移并发出 pointercancel，列表无法滑动 */
      touch-action: none;
      overscroll-behavior: none;
    }
    #composeApp canvas { touch-action: none; }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 32px;
      background: #f7f7f7;
      color: #191919;
      font: 15px system-ui, sans-serif;
      text-align: center;
      z-index: 100;
    }
    #loading h1 { margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.5px; color: #007aff; }
    #loading::before { content: ""; width: 36px; height: 36px; border: 3px solid #007aff26; border-top-color: #007aff; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #loading::before { animation: none; } }
    #loading p { max-width: 28em; line-height: 1.5; margin: 0; color: #666; font-size: 14px; }
    #loading button { margin-top: 12px; padding: 10px 20px; border: 0; border-radius: 12px; background: #007aff; color: white; font: inherit; cursor: pointer; }
    @media (prefers-color-scheme: dark) {
      html, body, #loading { background: #121212; color: #f4f4f4; }
      #loading p { color: #aaa; }
    }
  </style>
