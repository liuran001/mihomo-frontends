name: build

on:
  push:
    tags: ['v*', 'V*']
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  magisk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查版本号一致
        run: sh scripts/check-version.sh
      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 配置 Gradle 缓存与 Wrapper 校验
        uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v3
        with:
          # 默认会装已下架的 tools 包导致 sdkmanager 失败；只装需要的
          packages: ''
      - name: 安装按需设备桥接编译依赖
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: magisk/webd/go.mod
      - name: 网页管理服务测试
        working-directory: magisk/webd
        run: go vet ./... && go test ./...
      - name: Magisk 回归测试
        run: |
          node --test magisk/tests/frontend.test.js magisk/tests/bridge.test.js magisk/tests/onboarding.test.js magisk/tests/config.test.js magisk/tests/login.test.js magisk/tests/screen.test.js magisk/tests/proxylink.test.js
          sh magisk/tests/core.test.sh
          sh magisk/tests/backend.sh
          sh magisk/tests/backend-process.sh
          sh magisk/tests/backend-readiness.sh
          sh magisk/tests/backend-status.sh
          sh magisk/tests/tailscale.sh
          sh magisk/tests/host-webui.sh
      - name: 构建 Compose Miuix Wasm WebUI
        working-directory: magisk/webui
        run: sh ./gradlew --no-daemon wasmJsBrowserDistribution
      - name: 打包 Magisk/KernelSU 模块
        run: |
          sh magisk/build.sh --skip-webui-build
          ls -l dist/
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: magisk-module
          path: dist/*-magisk-*.zip
          if-no-files-found: error

  luci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装构建依赖
        run: sudo apt-get update && sudo apt-get install -y gcc ninja-build python3-venv libssl-dev zlib1g-dev libzstd-dev
      - name: 缓存 apk-tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/mh-tools
          key: mh-tools-${{ runner.os }}-v3.0.5
      - name: 安装 apk-tools
        run: sh luci/scripts/setup-apk-tools.sh
      - name: 打包 LuCI 应用（apk 与 ipk）
        run: |
          cd luci
          sh scripts/build-apk.sh
          sh scripts/build-ipk.sh
          ls -l dist/
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: luci-apk
          path: |
            luci/dist/*.apk
            luci/dist/*.ipk
          if-no-files-found: error

  release:
    needs: [magisk, luci]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 生成更新清单与更新说明
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          sh scripts/check-version.sh "$TAG"
          sh scripts/release-manifest.sh "$TAG" "$REPO" artifacts release
          cat release/update.json
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release/changelog.md
          files: |
            artifacts/magisk-module/*.zip
            artifacts/luci-apk/*.apk
            artifacts/luci-apk/*.ipk
            release/update.json
            release/changelog.md
            scripts/install.sh
